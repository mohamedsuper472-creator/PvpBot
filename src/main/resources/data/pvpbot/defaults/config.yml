# ============================================================================
#  Bot skins.
#
#  A bot wears the skin of the Minecraft account that has its name - but most
#  bot names are made up, so most bots came out in the default Steve/Alex skin.
#  With random on, they wear a skin borrowed from the pool instead:
#     missing - bots whose own name has no skin: generated names, name tables,
#               made-up names. A bot named after a real account keeps its own.
#     always  - every bot, whatever its name.
#     off     - the default skins, as before.
#  "/pvpbot spawn <name> <skinFrom>" still wears that account's skin. Only the
#  skin is borrowed - the bot keeps its own name - and every bot keeps its skin
#  across restarts.
#
#  The built-in pool is a few hundred ordinary players' names - common words
#  and first names, nearly all taken, with all sorts of skins. Names still on a
#  default skin are skipped, a skin two accounts share is used once, and a batch
#  of bots goes through every skin before any repeats. The first start looks
#  them up in the background (a minute or two, gently, to stay under Mojang's
#  rate limit; the console says how many came through) and keeps them in
#  skin-cache.yml, so later starts have them all at once, with no lookups.
# ============================================================================
skins:
  random: missing
  # The few hundred built-in names. Turn off to use only your own list below.
  built-in-pool: true
  # Your own additions: any real account names whose skins you want bots in.
  pool: []

# ============================================================================
#  Named pools of bot names, for /pvpbot spawn names:<table> <count>
#
#  Picks that many names at random from the table below, skipping any already
#  taken by a live bot or online player, and never using the same name twice
#  in one spawn. If the table runs out of usable names it just spawns as many
#  as it could and says so - it does not fall back to the generated names.
# ============================================================================
name-tables:
  default:
    - Alpha
    - Bravo
    - Charlie
    - Delta
    - Echo
