# ============================================================================
#  Factions live in factions.yml, created via commands:
#     /pvpbot faction create sweats
#     /pvpbot faction join sweats <bot>
#     /pvpbot faction hostile sweats rookies
#
#  Factions at peace leave each other alone - neither side's bots start a fight
#  with the other's members, and blasts hold off them - but a member who is
#  actually hit still hits back. Every real player is put in the "player"
#  faction when they join, so this keeps a faction's bots off players:
#     /pvpbot faction peace bandits player
#
#  Allied factions fight as one side while keeping their own settings:
#     /pvpbot faction ally bandits elite_bandits
#  ...so the two never target each other, revenge never fires between them and
#  orbital strikes hold off rather than catching them in the blast - but the
#  elites can still be a different calibre of opponent. That is the difference
#  from simply putting everyone in one faction.
#
#  Each faction can override ANY setting above, so factions differ in skill.
#  Anything not listed is inherited from this file (and from the active preset).
#  Set them in-game with:
#     /pvpbot faction set rookies miss-chance 45
#     /pvpbot faction set rookies auto-potion false
#
#  ...which produces factions.yml entries like:
#     factions:
#       rookies:
#         members: [Bot1, Bot2]
#         enemies: [sweats]
#         settings:
#           miss-chance: 45
#           auto-potion: false
#           attack-cooldown: 20
#       sweats:
#         settings:
#           miss-chance: 0
#           attack-cooldown: 10
#           melee-range: 3.5
# ============================================================================
